<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal2</title>
</head>

<body>
    <table border="1" style="width: auto; height: auto;">
        <tr>
            <td colspan="2" style="background-color: grey; color: white; text-align: center;">Personal Data</td>
        </tr>
        <td>
            <table>
                <tr>
                    <td>Nama</td>
                    <td>
                        <form>
                            <input type="text" name="nama">
                        </form>
                    </td>
                </tr>
                <tr>
                    <td>Alamat</td>
                    <td>
                        <form>
                            <textarea name="alamat" cols="25" rows="5"></textarea>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>
                        <form>
                            <input type="radio" name="jk" id="lk">
                            <label for="lk">laki-laki</label>
                            <div></div>
                            <input type="radio" name="jk" id="pr">
                            <label for="pr">perempuan</label>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td>
                        <form>
                            <select name="tanggal">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                            -
                            <select name="bulan">
                                <option value="Januri">Januari</option>
                                <option value="Februari">Februari</option>
                                <option value="Maret">Maret</option>
                            </select>
                            -
                            <select name="tahun">
                                <option value="1980">1980</option>
                                <option value="1981">1981</option>
                                <option value="1982">1982</option>
                                <option value="1983">1983</option>
                                <option value="1984">1984</option>
                            </select>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td>Jurusan</td>
                    <td>
                        <form>
                            <select width="100" multiple="multiple" size="3">
                                <option value="teknik informatika">teknik informatika</option>
                                <option value="sistem informasi">sistem informasi</option>
                                <option value="elektro">elektro</option>
                                <option value="sipil">sipil</option>
                            </select>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <fieldset>
                            <legend>Hobi</legend>
                            <table style="width: 300px;">
                                <tr>
                                    <td colspan="2">
                                        <input type="checkbox" name="membaca">Membaca <br>
                                        <input type="checkbox" name="menulis">Menulis <br>
                                        <input type="checkbox" name="catur">Catur <br>
                                    </td>
                                    <td>
                                        <input type="checkbox" name="voli   ">Voli <br>
                                        <input type="checkbox" name="badminton">Badminton <br>
                                        <input type="checkbox" name="golf">Golf <br>
                                    </td>
                                </tr>
                            </table>
                        </fieldset>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <hr>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: right;">
                        <form action="proses.html">
                            <input type="submit" name="submit">
                        </form>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <hr style="border: 3px solid black;">
                    </td>
                </tr>
            </table>
        </td>
    </table>
</body>

</html>
