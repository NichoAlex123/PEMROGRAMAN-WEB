<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal3</title>
</head>

<body>
    <table style="border: 1px solid black; width: auto;">
        <tr>
            <td>
                <h1><small>Form Tambah Data User</small></h1>
            </td>
        </tr>
        <td>
            <form action="#">
                <table>
                    <tr>
                        <td>Name</td>
                        <td>
                            :<input type="text" name="nama" required
                                oninvalid="this.setCustomValidity('Name is required!!!')"
                                oninput="this.setCustomValidity('')">>
                        </td>
                    </tr>
                    <tr>
                        <td>Address</td>
                        <td>
                            :<input type="text" name="address" required
                            oninvalid="this.setCustomValidity('Address is required!!!')"
                            oninput="this.setCustomValidity('')">>
                        </td>
                    </tr>
                    <tr>
                        <td>Email</td>
                        <td>
                            :<input type="email" name="email" required
                            oninvalid="if (this.value=='') {this.setCustomValidity('Harap isi bidang ini.')
                                
                            } else {this.setCustomValidity('Sertakan ‘@’ pada alamat email ini. '+this.value+' tidak memiliki ‘@')
                                
                            }"
                            oninput="this.setCustomValidity('')">>
                        </td>
                    </tr>
                    <tr>
                        <td>Home Page</td>
                        <td>
                            :<input type="text" name="home_page">
                        </td>
                    </tr>
                    <tr>
                        <td>Birthday</td>
                        <td>
                            :<input type="text" name="birthday" placeholder="hh/bb/tttt">
                        </td>
                    </tr>
                    <tr>
                        <td>Favorite Color</td>
                        <td>
                            :<input type="color" name="fav_color">
                        </td>
                    </tr>
                    <tr>
                        <td>IPK</td>
                        <td>
                            :<input type="number" name="ipk" min="0" max="4" step="0.1" value="0">
                        </td>
                    </tr>
                    <tr>
                        <td>Phone Number</td>
                        <td>
                            :<input type="text" name="phone_number" pattern="[0-9]{3}-[0-9]{7,10}">
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" name="add" value="Add">
                        </td>
                    </tr>
                </table>
            </form>

        </td>
    </table>
</body>

</html>
