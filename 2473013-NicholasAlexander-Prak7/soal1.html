<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal1</title>
    <style>
        .container {
            width: 400px;
            padding: 10px;
        }

        textarea {
            width: 200px;
            height: 100px;
        }

        .counter {
            text-align: right;
            margin-top: -4px;
        }
        
        #txt2 {
            text-align: right;
            width: 60px;

        }
        
        td {
            vertical-align: top;
        }
    </style>
</head>

<body>
    <div class="container">
        <table>
            <tr>
                <td>Judul <span>:</span></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Deskripsi <span>:</span></td>
                <td><textarea id="deskripsi" onkeyup="call_onKeyPress(this)"></textarea>
                    <br>
                    <div class="counter">
                        <input type="text" id="txt2" value="0/256" readonly>
                    </div>

                </td>
            </tr>
        </table>
    </div>

    <script>
        function call_onKeyPress(ob) {
            obval = ob.value;
            document.getElementById("txt2").value = obval.length + "/256";

            if (obval.length > 256) {
                obval = obval.substr(0, 256)
                ob.value = obval
            }

            document.getElementById("txt2").value = obval.length + "/256";
        }
    </script>
</body>

</html>
