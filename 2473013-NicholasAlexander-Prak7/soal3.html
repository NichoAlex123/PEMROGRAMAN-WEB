<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal3</title>
    <style>
        .box {
            width: 350px;
            padding: 15px;
            border: 1px solid #aaa;
            box-shadow: 2px 2px 10px gray;
        }

        input,
        select {
            margin: 5px;
            padding: 5px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hasil {
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="box">
        <label>Data</label>
        <input type="number" id="data">

        <br>

        <button onclick="addData()">Add</button>

        <select onchange="proses(this.value)">
            <option value="">Pilih Operasi</option>
            <option value="display">Display</option>
            <option value="count">Count</option>
            <option value="sum">Sum</option>
            <option value="avg">Average</option>
            <option value="max">Max</option>
            <option value="min">Min</option>
            <option value="ganjil">Ganjil</option>
            <option value="genap">Genap</option>
            <option value="hapus">Hapus</option>
        </select>

        <div class="row">
            <label>Hasil</label>
            <input type="text" id="hasil" class="hasil" readonly>
        </div>
    </div>

    <script>
        var arr = [];

        function addData() {
            var input = document.getElementById("data");

            if (input.value != "") {
                arr.push(parseInt(input.value));
            }

            input.value = "";
        }

        function proses(pilih) {
            var hasil = document.getElementById("hasil");
            var output = "";

            if (pilih == "display") {
                output = arr.join(", ");
            }
            else if (pilih == "count") {
                output = arr.length;
            }
            else if (pilih == "sum") {
                var sum = 0;
                for (var i = 0; i < arr.length; i++) {
                    sum += arr[i];
                }
                output = sum;
            }
            else if (pilih == "avg") {
                var sum = 0;
                for (var i = 0; i < arr.length; i++) {
                    sum += arr[i];
                }
                output = arr.length ? (sum / arr.length) : 0;
            }
            else if (pilih == "max") {
                output = arr.length ? Math.max(...arr) : "";
            }
            else if (pilih == "min") {
                output = arr.length ? Math.min(...arr) : "";
            }
            else if (pilih == "ganjil") {
                var ganjil = arr.filter(function (x) {
                    return x % 2 != 0;
                });
                output = ganjil.join(", ");
            }
            else if (pilih == "genap") {
                var genap = arr.filter(function (x) {
                    return x % 2 == 0;
                });
                output = genap.join(", ");
            }
            else if (pilih == "hapus") {
                arr = [];
                output = "Data dihapus";
            }

            hasil.value = output;
        }
    </script>
</body>

</html>
