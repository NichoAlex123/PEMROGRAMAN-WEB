<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal5</title>
    <style>
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .navbar {
            display: flex;
        }

        .navbar > li {
            position: relative;
            margin-right: 3px;
            width: 120px;
        }

        .navbar a {
            display: block;
            text-align: center;
            padding: 10px 20px;
            text-decoration: none;
            color: black;

            border-style: dotted;
            border-color: grey;
            border-width: 2px;
        }

        .navbar a:hover {
            background-color: black;
            color: white;
        }

        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
        }

        .dropdown:hover .submenu {
            display: block;
        }
    </style>
</head>

<body>
    <ul class="navbar">
        <li><a href="#">Home</a></li>

        <li class="dropdown">
            <a href="#">News</a>
            <ul class="submenu">
                <li><a href="#">Sports</a></li>
                <li><a href="#">Music</a></li>
                <li><a href="#">Movie</a></li>
            </ul>
        </li>

        <li><a href="#">Contact</a></li>
        <li><a href="#">About</a></li>
    </ul>
</body>

</html>
