<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal1</title>
    <style>
        table {
            margin: 20px;
        }
        .box {
            position: relative;
            display: inline-block;
            padding: 20px;
        }
        img {
            width: 100px;
        }
        .topleft, .topright, .bottomleft, .bottomright{
            position: absolute;
            width: 25px;
            height: 25px;
            border: 5px solid #FF0000;
        }
        .topleft {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
        }
        .topright {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
        }
        .bottomleft {
            bottom: 0;
            left: 0;
            border-right: none;
            border-top: none;
        }
        .bottomright {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
        }
        .box:hover .topleft,
        .box:hover .topright,
        .box:hover .bottomleft,
        .box:hover .bottomright {
            border-color: #FF00FF;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td>
                <div class="box">
                    <img src="src/src/star.jpg" alt="">

                    <div class="topleft"></div>
                    <div class="topright"></div>
                    <div class="bottomleft"></div>
                    <div class="bottomright"></div>
                </div>
            </td>
        </tr>
    </table>
</body>

</html>
