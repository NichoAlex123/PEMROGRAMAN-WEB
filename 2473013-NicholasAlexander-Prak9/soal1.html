<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jquery-4.0.0.min.js"></script>
    <title>Soal1</title>
    <style>
        .menu {
            list-style: none;
            display: flex;
            gap: 10px;
        }

        .menu>li {
            position: relative;
            padding: 5px 15px;
            width: 100px;
        }

        .menu li ul {
            list-style: none;
            position: absolute;
            top: 30px;
            left: 0;
            padding: 10px;
            border: 1px solid #ff2b8a;
            display: none;
            width: 100%;
            box-sizing: border-box;
        }

        .menu li ul li {
            color: black;
            padding: 3px 0;
        }
    </style>
</head>

<body>
    <ul class="menu">
        <li class="item"><u>jQuery</u>
            <ul>
                <li><u>Download</u></li>
                <li><u>Documentation</u></li>
                <li><u>Blog</u></li>
            </ul>
        </li>

        <li class="item"><u>Community</u>
            <ul>
                <li><u>Mailing List</u></li>
                <li><u>Tutorials</u></li>
                <li><u>Demos</u></li>
                <li><u>Plugins</u></li>
            </ul>
        </li>

        <li class="item"><u>Development</u>
            <ul>
                <li><u>Source Code</u></li>
                <li><u>Bug Tracking</u></li>
                <li><u>Recent Changes</u></li>
            </ul>
        </li>
    </ul>

    <script>
        $(document).ready(function () {

            $("li.item").css("background-color", "#ff2b8a");
            $("li.item").css("color", "white");

            $("li.item ul").hide();

            $("li.item").hover(
                function () {
                    $("li.item ul").hide();
                    $(this).children("ul").show();
                },
                function () {
                    $(this).children("ul").hide();
                }
            );

        });
    </script>
</body>

</html>
