<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jquery-4.0.0.min.js"></script>
    <title>Soal2</title>
    <style>
        .list div {
            margin: 5px 0;
        }
    </style>
</head>

<body>
    <input type="text" id="nama">
    <button id="add">Add</button>
    <button id="search">Search</button>

    <div class="list">
        <div>John Resig</div>
        <div>George Martin</div>
        <div>Malcom John Sinclair</div>
        <div>J. Ohn</div>
    </div>
    <script>
        $(document).ready(function () {

            $("#add").click(function () {
                let nama = $("#nama").val();

                if (nama != "") {
                    $("<div>" + nama + "</div>").appendTo(".list");
                    $("#nama").val("");
                }
            });

            $("#search").click(function () {
                let keyword = $("#nama").val();

                $(".list div").css("text-decoration", "none");

                $(".list div:contains('" + keyword + "')")
                    .css("text-decoration", "underline");
            });

        });
    </script>
</body>

</html>
