<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal1</title>
    <style>
        table {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <label>Angka Pertama :</label>
    <input type="text" id="a1"><br><br>

    <label>Angka Kedua :</label>
    <input type="text" id="a2"><br><br>

    <button onclick="hitung()">Count</button>

    <br><br>

    <table border="1" cellpadding="40">
        <tr>
            <td id="t1"></td>
            <td>+</td>
            <td id="t2"></td>
            <td>=</td>
            <td id="hasilTambah"></td>
        </tr>
        <tr>
            <td id="t3"></td>
            <td>-</td>
            <td id="t4"></td>
            <td>=</td>
            <td id="hasilKurang"></td>
        </tr>
    </table>

    <script>
        function hitung() {
            let x = document.getElementById("a1").value;
            let y = document.getElementById("a2").value;

            x = parseInt(x);
            y = parseInt(y);

            if (isNaN(x) && isNaN(y)) {
                alert("angka pertama dan kedua harus angka");
                return;
            }
            else if (isNaN(x)) {
                alert("angka pertama bukan angka");
                return;
            }
            else if (isNaN(y)) {
                alert("angka kedua harus angka");
                return;
            }

            document.getElementById("t1").innerHTML = x;
            document.getElementById("t2").innerHTML = y;
            document.getElementById("t3").innerHTML = x;
            document.getElementById("t4").innerHTML = y;

            document.getElementById("hasilTambah").innerHTML = x + y;
            document.getElementById("hasilKurang").innerHTML = x - y;
        }
    </script>

</body>

</html>
