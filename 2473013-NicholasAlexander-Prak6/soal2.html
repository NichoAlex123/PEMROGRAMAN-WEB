<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal2</title>
    <style>
        table {
            border: 1px solid black;
        }
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <table id="tabel_kali"></table>

    <script>
        let angka;

        do {
            angka = prompt("A number?");
            angka = parseInt(angka);
        } while (isNaN(angka));

        let hasil = "";

        for (let i = 1; i <= angka; i++) {
            hasil += "<tr>";
            hasil += "<td>" + i + "</td>";
            hasil += "<td>x</td>";
            hasil += "<td>" + angka + "</td>";
            hasil += "<td>=</td>";
            hasil += "<td>" + (i * angka) + "</td>";
            hasil += "</tr>";
        }

        document.getElementById("tabel_kali").innerHTML = hasil;
    </script>
</body>

</html>
