<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soal4</title>
</head>

<body>
    <label>Input :</label>
    <input type="text" id="input"><br><br>

    <label>Output :</label>
    <input type="text" id="output" readonly><br><br>

    <select id="mode">
        <option value="decbin">decimal-biner</option>
        <option value="bindec">biner-decimal</option>
    </select><br><br>

    <button onclick="proses()">PROSES</button>
    <button onclick="resetData()">RESET</button>

    <script>
        function proses() {
            let nilai = document.getElementById("input").value;
            let mode = document.getElementById("mode").value;

            if (mode === "decbin") {
                let n = parseInt(nilai);

                if (isNaN(n) || n < 0 || n > 255) {
                    alert("Input harus angka 0-255");
                    return;
                }

                let biner = "";

                while (n > 0) {
                    biner = (n % 2) + biner;
                    n = Math.floor(n / 2);
                }

                if (biner === "") biner = "0";

                document.getElementById("output").value = biner;
            }
            else if (mode === "bindec") {
                let biner = nilai;

                if (!/^[01]{1,8}$/.test(biner)) {
                    alert("Input harus biner (0/1) maksimal 8 digit");
                    return;
                }

                let desimal = 0;

                for (let i = 0; i < biner.length; i++) {
                    let digit = parseInt(biner[i]);
                    desimal = desimal * 2 + digit;
                }

                document.getElementById("output").value = desimal;
            }
        }
        function resetData() {
            document.getElementById("input").value = "";
            document.getElementById("output").value = "";
        } 
    </script>
</body>

</html>
