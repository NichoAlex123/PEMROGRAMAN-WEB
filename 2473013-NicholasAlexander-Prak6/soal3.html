<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal3</title>
    <style>
        #container {
            width: 800px;
            height: 600px;
            border: 0;
            margin-top: 20px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        td {
            width: 30px;
            height: 30px;
        }

        .block {
            background-color: orange;
            border: 1px solid white;
        }
    </style>
</head>

<body>
    <label>Tinggi Piramida :</label>
    <input type="text" id="tinggi">
    <br>
    <button onclick="proses()">proses</button>

    <div id="container">
        <table id="piramida"></table>
    </div>

    <script>
        function proses() {
            let t = document.getElementById("tinggi").value;
            t = parseInt(t);

            let hasil = "";

            for (let i = 1; i <= t; i++) {
                hasil += "<tr>";

                for (let j = 1; j <= t - i; j++) {
                    hasil += "<td></td>";
                }

                for (let k = 1; k <= (2 * i - 1); k++) {
                    hasil += "<td class='block'></td>";
                }

                for (let j = 1; j <= t - i; j++) {
                    hasil += "<td></td>";
                }

                hasil += "</tr>";
            }

            document.getElementById("piramida").innerHTML = hasil;
        }
    </script>
</body>

</html>
