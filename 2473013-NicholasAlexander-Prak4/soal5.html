<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal5</title>
    <style>
        .ungu {
            list-style-image: url("img/sqpurple.gif");
        }
        .orange {
            list-style-image: url("img/sqorange.gif");
        }
        .sub {
            list-style-type: none;
        }
        .sub li {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <ul class="ungu">
        <li>Coffe</li>
        <li>Tea
            <ul class="orange">
                <li><span style="color: orange;"><b>Cold</b></span> Tea
                    <ul class="sub">
                        <li>Jasmine</li>
                        <li>Green</li>
                    </ul>
                </li>
                <li><span style="color: orange;"><b>Hot</b></span> Tea</li>
            </ul>
        </li>
        <li>Coca Cola</li>
    </ul>
</body>

</html>
