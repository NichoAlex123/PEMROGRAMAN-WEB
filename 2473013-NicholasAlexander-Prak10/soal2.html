<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jquery.js"></script>
    <title>Soal 2</title>
    <style>

        body{
            font-family: Times New Roman;
        }

        table{
            border-collapse: collapse;
        }

        .outer{
            width: 750px;
            margin-top: 20px;
        }

        .inner{
            width: 100%;
            margin: 1px 0;
        }

        .inner td{
            padding: 10px;
        }

        .header{
            text-align: center;
        }

        .footer{
            padding: 5px;
        }

        a{
            color: blue;
        }

        p {
            margin: 0;
        }
    </style>


</head>

<body>
    <button id="look">Look</button>

<div id="hasil"></div>

<script>

$(document).ready(function(){

    $("#look").click(function(){

        $("#hasil").html("");

        $.getJSON("SIJson.json", function(data){

            $("#hasil").append(

                "<table border='1' class='outer'>" +

                    "<tr>" +

                        "<td id='content'></td>" +

                    "</tr>" +

                "</table>"

            );

            $("#content").append(

                "<table border='1' class='inner'>" +

                    "<tr>" +

                        "<td class='header'>" +

                            "<h2>" +

                                "<a href='" + data.link + "' target='_blank'>" +

                                    data.title +

                                "</a>" +

                            "</h2>" +

                        "</td>" +

                    "</tr>" +

                "</table>"

            );

            $("#content").append(

                "<table border='1' class='inner'>" +

                    "<tr>" +

                        "<td id='isi'></td>" +

                    "</tr>" +

                "</table>"

            );

            $.each(data.items, function(i, item){

                $("#isi").append(

                    "<a href='" + item.link + "' target='_blank'>" +

                        item.title +

                    "</a>" +

                    "<p>" +

                        "By : " + item.author +

                        " / <i>" + item.published + "</i>" +

                    "</p>" +

                    "<br>" +

                    "<p>" +

                        item.description +

                    "</p>" +

                    "<br>" +

                    "<p>" +

                        "Universitas : " +

                        "<a href='" + item.universitas.m + "' target='_blank'>" +

                            "Click Here" +

                        "</a>" +

                    "</p>" +

                    "<p>" +

                        "Tag(s) : " + item.tags +

                    "</p><br>"

                );

            });

            $("#content").append(

                "<table border='1' class='inner'>" +

                    "<tr>" +

                        "<td class='footer'>" +

                            "©S1-SI FIT UKM" +

                        "</td>" +

                    "</tr>" +

                "</table>"

            );

        });

    });

});

</script>

</body>

</html>
