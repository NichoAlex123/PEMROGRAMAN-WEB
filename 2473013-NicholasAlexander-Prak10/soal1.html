<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jquery.js"></script>
    <title>Soal 1</title>
    <style>
        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 500px;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th,
        td {
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>
    <h3>Selamat! Berikut adalah Daftar Mahasiswa yang mendapat <br>Nilai A Pemrograman Web SI Tahun Ajaran 2023/2024
    </h3>

    <input type="radio" name="kelas" value="nilaiA.js"> Kelas A <br>
    <input type="radio" name="kelas" value="nilaiB.js"> Kelas B <br>
    <input type="radio" name="kelas" value="nilai.js" checked> Semua <br>

    <button id="search">Search</button>

    <table>

        <thead>
            <tr>
                <th>NRP</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Nilai Akhir</th>
            </tr>
        </thead>

        <tbody id="hasil">

        </tbody>

    </table>

    <script>
        $(document).ready(function () {

            $("#search").click(function () {

                $("#hasil").html("");

                var file = $(":radio[name='kelas']:checked").val();

                $.getJSON(file, function (data) {

                    $.each(data.nilai, function (i, item) {

                        $("#hasil").append(

                            "<tr>" +

                            "<td>" + item.nrp + "</td>" +
                            "<td>" + item.nama + "</td>" +
                            "<td>" + item.kelas + "</td>" +
                            "<td>" + item.nilaiakhir + "</td>" +

                            "</tr>"

                        );

                    });

                    $("#hasil tr:odd").css("background-color", "#CCFFAA");
                    $("#hasil tr:even").css("background-color", "#FFFFCC");

                });

            });

        });

    </script>
</body>

</html>
